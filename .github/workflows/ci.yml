name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories are published without any commit, so re-check weekly.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Integration tests (sqlx::test) run against a real PostgreSQL.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Licence policy, known vulnerabilities and sources for all dependencies.
  # Kept separate so a newly published advisory does not block unrelated work.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (licences, advisories, sources)
        working-directory: backend
        run: cargo deny check
      - name: cargo audit (RustSec advisories for Cargo.lock)
        working-directory: backend
        run: cargo audit
      # backend/.cargo/audit.toml ignores advisories for sqlx's optional MySQL
      # and SQLite drivers because they are only listed in Cargo.lock. Fail if
      # any of them ever becomes part of the real build graph.
      - name: ignored advisories must stay out of the build graph
        working-directory: backend
        run: |
          for crate in rsa libsqlite3-sys sqlx-mysql sqlx-sqlite; do
            if ! cargo tree --workspace --target all --all-features -i "$crate" 2>&1 | grep -q "nothing to print"; then
              echo "::error::$crate is now in the build graph; remove its advisory ignore and fix it"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit (moderate and above)
        working-directory: frontend
        run: pnpm audit --audit-level moderate
