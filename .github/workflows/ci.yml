name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories are published without any commit, so re-check weekly.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Integration tests (sqlx::test) run against a real PostgreSQL.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Behind Caddy every request comes from Caddy's address, so without this
      # setting all users share one rate-limit bucket.
      - name: Compose keeps trusted proxy hops configured
        working-directory: .
        run: |
          grep -q 'RUSTCHAT_TRUSTED_PROXY_HOPS: "1"' deployment/compose.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @rustchat/web exec playwright install --with-deps chromium
      - run: pnpm --filter @rustchat/web test:e2e
      - run: pnpm build

  # Licence policy, known vulnerabilities and sources for all dependencies.
  # Kept separate so a newly published advisory does not block unrelated work.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (licences, advisories, sources)
        working-directory: backend
        run: cargo deny check
      - name: cargo audit (RustSec advisories for Cargo.lock)
        working-directory: backend
        run: cargo audit
      # backend/.cargo/audit.toml ignores advisories for sqlx's optional MySQL
      # and SQLite drivers because they are only listed in Cargo.lock. Fail if
      # any of them ever becomes part of the real build graph.
      - name: ignored advisories must stay out of the build graph
        working-directory: backend
        run: |
          for crate in rsa libsqlite3-sys sqlx-mysql sqlx-sqlite; do
            if ! cargo tree --workspace --target all --all-features -i "$crate" 2>&1 | grep -q "nothing to print"; then
              echo "::error::$crate is now in the build graph; remove its advisory ignore and fix it"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit (moderate and above)
        working-directory: frontend
        run: pnpm audit --audit-level moderate

  # Proves the backup tooling works on a real database: migrate, create data
  # through the API, back it up, and restore the dump into a scratch database
  # with the same checks operators run (deployment/verify-backup.sh).
  restore-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rustchat
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_DB: rustchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustchat -d rustchat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: rustchat
      PGPASSWORD: ci-superuser
      PGDATABASE: rustchat
      # The runner's PostgreSQL client may be older than the server; dump and restore
      # with the matching version.
      RUSTCHAT_PG_PREFIX: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE postgres:18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Create the application and migration roles, as the Compose stack does
        env:
          POSTGRES_USER: rustchat
          POSTGRES_DB: rustchat
          RUSTCHAT_APP_DB_PASSWORD: ci-app
          RUSTCHAT_MIGRATOR_DB_PASSWORD: ci-migrator
        run: sh deployment/postgres-init.sh
      - name: Build the server
        working-directory: backend
        run: cargo build -p rustchat-server
      - name: Apply migrations as the migration role
        env:
          DATABASE_URL: postgres://rustchat_migrator:ci-migrator@127.0.0.1:5432/rustchat
        run: backend/target/debug/rustchat-server migrate
      - name: Start the server as the application role
        env:
          DATABASE_URL: postgres://rustchat_app:ci-app@127.0.0.1:5432/rustchat
          RUSTCHAT_ALLOWED_ORIGINS: http://localhost:8080
          RUSTCHAT_COOKIE_SECURE: "false"
          RUSTCHAT_BIND: 127.0.0.1:8080
        run: |
          backend/target/debug/rustchat-server serve > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/readyz && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Create sample data through the API
        run: |
          api() { curl -fsS -X "$1" "http://127.0.0.1:8080$2" -H 'Origin: http://localhost:8080' -H 'Content-Type: application/json' "${@:3}"; }
          password="correct horse battery"
          for user in alice bobby; do
            api POST /api/v1/auth/register -d "{\"username\":\"$user\",\"password\":\"$password\"}" > /dev/null
          done
          api POST /api/v1/auth/login -c jar.txt -d "{\"username\":\"alice\",\"password\":\"$password\"}" > /dev/null
          conversation=$(api POST /api/v1/conversations -b jar.txt -d '{"type":"direct","username":"bobby"}' | sed -n 's/.*"conversation":{"id":"\([^"]*\)".*/\1/p')
          test -n "$conversation"
          api POST "/api/v1/conversations/$conversation/messages" -b jar.txt \
            -d "{\"client_message_id\":\"$(cat /proc/sys/kernel/random/uuid)\",\"content\":\"backup me\"}" > /dev/null
      - name: Back up and verify the backup restores
        run: |
          sh deployment/backup.sh backups
          sh deployment/verify-backup.sh backups/*.dump
      - name: A damaged backup must be rejected
        run: |
          head -c 3000 backups/*.dump > backups/damaged.dump
          if sh deployment/verify-backup.sh backups/damaged.dump; then
            echo "::error::a damaged backup was reported as good"
            exit 1
          fi
