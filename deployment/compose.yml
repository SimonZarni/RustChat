name: rustchat
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rustchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: rustchat
      RUSTCHAT_APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set a separate APP_DB_PASSWORD}
      RUSTCHAT_MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set a separate MIGRATOR_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-rustchat-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustchat -d rustchat"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]
  server:
    image: ${RUSTCHAT_SERVER_IMAGE:-rustchat-server:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://rustchat_app:${APP_DB_PASSWORD}@db:5432/rustchat
      RUSTCHAT_BIND: 0.0.0.0:8080
      RUSTCHAT_COOKIE_SECURE: "true"
      # Caddy is the only client of this service (8080 is not published), so
      # rate limits must key on the X-Forwarded-For entry Caddy appends.
      # Without this every user shares Caddy's address and one rate-limit bucket.
      RUSTCHAT_TRUSTED_PROXY_HOPS: "1"
      RUSTCHAT_ALLOWED_ORIGINS: https://${RUSTCHAT_DOMAIN:?set RUSTCHAT_DOMAIN}
      RUSTCHAT_REGISTRATION: ${RUSTCHAT_REGISTRATION:-open}
      RUSTCHAT_DB_MAX_CONNECTIONS: ${RUSTCHAT_DB_MAX_CONNECTIONS:-10}
      RUSTCHAT_GROUP_MEMBER_LIMIT: ${RUSTCHAT_GROUP_MEMBER_LIMIT:-100}
      RUSTCHAT_SESSION_IDLE_TIMEOUT_DAYS: ${RUSTCHAT_SESSION_IDLE_TIMEOUT_DAYS:-7}
      RUSTCHAT_LOGIN_PER_IP_LIMIT: ${RUSTCHAT_LOGIN_PER_IP_LIMIT:-30}
      RUSTCHAT_LOGIN_PER_USERNAME_LIMIT: ${RUSTCHAT_LOGIN_PER_USERNAME_LIMIT:-10}
      RUSTCHAT_REGISTER_PER_IP_LIMIT: ${RUSTCHAT_REGISTER_PER_IP_LIMIT:-5}
      RUSTCHAT_API_READ_LIMIT: ${RUSTCHAT_API_READ_LIMIT:-600}
      RUSTCHAT_API_WRITE_LIMIT: ${RUSTCHAT_API_WRITE_LIMIT:-120}
      RUSTCHAT_MESSAGE_SEND_LIMIT: ${RUSTCHAT_MESSAGE_SEND_LIMIT:-60}
      RUSTCHAT_CREATE_LIMIT: ${RUSTCHAT_CREATE_LIMIT:-30}
      RUSTCHAT_UNAUTHENTICATED_LIMIT: ${RUSTCHAT_UNAUTHENTICATED_LIMIT:-120}
      RUSTCHAT_ADMIN_USER_IDS: ${RUSTCHAT_ADMIN_USER_IDS:-}
      RUSTCHAT_PUBLIC_URL: ${RUSTCHAT_PUBLIC_URL:-}
      RUSTCHAT_SMTP_HOST: ${RUSTCHAT_SMTP_HOST:-}
      RUSTCHAT_SMTP_PORT: ${RUSTCHAT_SMTP_PORT:-465}
      RUSTCHAT_SMTP_USERNAME: ${RUSTCHAT_SMTP_USERNAME:-}
      RUSTCHAT_SMTP_PASSWORD: ${RUSTCHAT_SMTP_PASSWORD:-}
      RUSTCHAT_EMAIL_FROM: ${RUSTCHAT_EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks: [private]
  migrate:
    image: ${RUSTCHAT_SERVER_IMAGE:-rustchat-server:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://rustchat_migrator:${MIGRATOR_DB_PASSWORD}@db:5432/rustchat
    depends_on:
      db:
        condition: service_healthy
    profiles: [operations]
    networks: [private]
  web:
    image: ${RUSTCHAT_WEB_IMAGE:-rustchat-web:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RUSTCHAT_DOMAIN: ${RUSTCHAT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    networks: [private]
networks:
  private:
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
