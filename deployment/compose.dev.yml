# Local development services only. Not a production deployment.
# Usage (from repo root):
#   cp deployment/.env.example deployment/.env   # then edit the password
#   docker compose --env-file deployment/.env -f deployment/compose.dev.yml up -d
name: rustchat-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: rustchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deployment/.env}
      POSTGRES_DB: rustchat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustchat -d rustchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
