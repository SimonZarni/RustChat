[workspace]
resolver = "3"
members = ["apps/server", "crates/domain", "crates/application", "crates/infrastructure", "crates/http"]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
