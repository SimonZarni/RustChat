[package]
name = "rustchat-infrastructure"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rustchat-domain = { version = "0.0.0", path = "../domain" }
rustchat-application = { version = "0.0.0", path = "../application" }
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.23.1"
getrandom = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
sha2 = "0.11.1"
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
uuid = { version = "1.29.2", features = ["serde"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth"] }
aes-gcm = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
