[package]
name = "rustchat-http"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustchat-domain = { version = "0.0.0", path = "../domain" }
rustchat-application = { version = "0.0.0", path = "../application" }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.55", features = ["serde-well-known"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["serde"] }

[dev-dependencies]
rustchat-infrastructure = { path = "../infrastructure" }
http-body-util = "0.1.5"
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
