[package]
name = "rustchat-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rustchat-application = { version = "0.0.0", path = "../../crates/application" }
rustchat-infrastructure = { version = "0.0.0", path = "../../crates/infrastructure" }
rustchat-http = { version = "0.0.0", path = "../../crates/http" }
axum = "0.8.9"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
